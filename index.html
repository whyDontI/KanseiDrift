<script>
/* ==================================================================
   CONFIG - every handling number lives here. Physics reads these
   every frame, so changing a value takes effect immediately.
   ================================================================== */
// @sim-begin
const CONFIG = {
  // --- Speed ---
  maxSpeed: 620,          // top forward speed in pixels per second (drag also caps it near acceleration / friction)
  acceleration: 520,      // how fast gas adds speed (px/s per second)
  brakePower: 950,        // how hard brake slows you down (px/s per second)
  friction: 0.7,          // drag: share of speed lost per second (also limits top speed with the gas held)
  crashSpeed: 260,        // speed into a wall (px/s) above which a hit is a Crash, not a Scrape
  grassDrag: 1.6,         // extra drag per second while the car is mostly on grass
  wallBounce: 0.2,        // share of the speed into a wall that bounces back
  wallScrapeDrag: 2.5,    // speed lost per second while rubbing along a wall
  crashSpeedKept: 0.55,   // share of speed the car keeps after a Crash
  // --- Steering ---
  steerSpeed: 2.6,        // turn rate in radians per second at full lock
  // --- Grip ---
  normalGrip: 9,          // sideways grip while driving normally (higher = stickier)
  driftGrip: 4.5,         // sideways grip when steering hard at speed (lower = slidier)
  handbrakeGrip: 2.5,     // sideways grip while Space is held
  gripRecoverySpeed: 8,   // how fast grip returns once you straighten up (per second)
  driftEnterAngle: 15,    // slip angle (degrees) above which a Drift starts
  driftExitAngle: 8,      // slip angle (degrees) below which a Drift ends (keep below the start angle)
  minDriftSpeed: 150,     // slowest speed (px/s) at which a Drift can start
  // --- Drift Score ---
  driftScoreRate: 50,     // points per second while drifting (before the Combo Multiplier)
  comboTimeout: 1.5,      // seconds without drifting before the chain ends
  comboStepTime: 2        // seconds of Drifting that add +1 to the Combo Multiplier
};

// ---- Tuning Panel data (kept here, DOM-free, so the tests can reach it) ----
// Frozen copy of the starting values, used by the Tuning Panel's Reset and presets.
const DEFAULT_CONFIG = Object.freeze({ ...CONFIG });

// Slider definitions for the Tuning Panel: one entry per CONFIG value.
const CONFIG_META = {
  maxSpeed:          { group: 'Speed',       min: 200,  max: 1200, step: 10 },
  acceleration:      { group: 'Speed',       min: 100,  max: 1500, step: 10 },
  brakePower:        { group: 'Speed',       min: 200,  max: 2000, step: 10 },
  friction:          { group: 'Speed',       min: 0,    max: 3,    step: 0.05 },
  crashSpeed:        { group: 'Speed',       min: 50,   max: 800,  step: 10 },
  grassDrag:         { group: 'Speed',       min: 0,    max: 6,    step: 0.1 },
  wallBounce:        { group: 'Speed',       min: 0,    max: 1,    step: 0.05 },
  wallScrapeDrag:    { group: 'Speed',       min: 0,    max: 8,    step: 0.1 },
  crashSpeedKept:    { group: 'Speed',       min: 0.1,  max: 1,    step: 0.05 },
  steerSpeed:        { group: 'Steering',    min: 0.5,  max: 5,    step: 0.1 },
  normalGrip:        { group: 'Grip',        min: 1,    max: 20,   step: 0.5 },
  driftGrip:         { group: 'Grip',        min: 0.2,  max: 15,   step: 0.1 },
  handbrakeGrip:     { group: 'Grip',        min: 0.1,  max: 10,   step: 0.1 },
  gripRecoverySpeed: { group: 'Grip',        min: 0.5,  max: 20,   step: 0.5 },
  driftEnterAngle:   { group: 'Grip',        min: 3,    max: 60,   step: 1 },
  driftExitAngle:    { group: 'Grip',        min: 1,    max: 45,   step: 1 },
  minDriftSpeed:     { group: 'Grip',        min: 20,   max: 600,  step: 10 },
  driftScoreRate:    { group: 'Drift Score', min: 5,    max: 500,  step: 5 },
  comboTimeout:      { group: 'Drift Score', min: 0.2,  max: 5,    step: 0.1 },
  comboStepTime:     { group: 'Drift Score', min: 0.5,  max: 10,   step: 0.5 }
};

// Presets only set sliders; anything they leave out goes back to the default.
const PRESETS = {
  'Arcade':        { normalGrip: 7,  driftGrip: 3.5, handbrakeGrip: 2,   gripRecoverySpeed: 10, steerSpeed: 2.8, acceleration: 600 },
  'Realistic':     { normalGrip: 12, driftGrip: 8,   handbrakeGrip: 4,   gripRecoverySpeed: 12, steerSpeed: 2.3 },
  'Sideways Mode': { normalGrip: 5,  driftGrip: 1.2, handbrakeGrip: 0.6, gripRecoverySpeed: 3,  steerSpeed: 2.9, friction: 0.5, acceleration: 600 }
};
// @sim-end
</script>

<body>
<canvas id="game"></canvas>
<div id="hudScore"><div class="small">SCORE</div><div class="big" id="hudTotal">0</div>
  <div class="chain" id="hudChain"></div><div class="small" id="hudBest">Best chain 0</div><div class="small" id="hudBestScore">Best score 0</div></div>
<div id="hudLap"><div class="small" id="hudLapNo">LAP 1</div><div class="big" id="hudLapTime">--:--.---</div>
  <div class="small" id="hudLapLast">Last --:--.---</div><div class="small" id="hudLapBest">Best --:--.---</div><div class="small" id="hudLapCp"></div></div>
<div id="hud"><div><span class="big" id="hudSpeed">0</span> <span class="small">km/h</span></div><div class="small" id="hudDrift"></div></div>

<script>
/* ==================================================================
   INPUT - keyboard state. Driving keys never scroll the page.
   ================================================================== */
const input = { gas: false, brake: false, left: false, right: false, handbrake: false, respawn: false };
const KEY_MAP = {
  KeyW: 'gas', ArrowUp: 'gas',
  KeyS: 'brake', ArrowDown: 'brake',
  KeyA: 'left', ArrowLeft: 'left',
  KeyD: 'right', ArrowRight: 'right',
  Space: 'handbrake',
  KeyR: 'respawn'
};
window.addEventListener('keydown', e => {
  const k = KEY_MAP[e.code];
  if (!k || e.metaKey || e.ctrlKey || e.altKey) return;   // leave browser shortcuts like Cmd+R alone
  e.preventDefault();
  input[k] = true;
});
window.addEventListener('keyup', e => {
  const k = KEY_MAP[e.code];
  if (!k) return;
  e.preventDefault();
  input[k] = false;
});
window.addEventListener('blur', () => { for (const k in input) input[k] = false; });

/* ==================================================================
   PHYSICS - DOM-free. Velocity, heading and sideways grip.
   Everything between the @sim markers can be run headlessly by tests.
   ================================================================== */
// @sim-begin
const GRIP_DROP_RATE = 60;        // how fast grip falls to a lower target (per second)
const HANDBRAKE_DRAG = 0.4;       // extra speed share lost per second under handbrake
const REVERSE_SPEED_SHARE = 0.4;  // reverse top speed as a share of maxSpeed
const DRIFT_SPEED_START = 0.5;    // speed share where hard steering starts to cut grip
const DRIFT_SPEED_FULL = 0.8;     // speed share where hard steering gives full driftGrip
const STEER_FULL_AT = 0.12;       // speed share where steering reaches full strength

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(a, b, v) { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

function createCarState(config, x = 0, y = 0, heading = 0) {
  return { x, y, heading, vx: 0, vy: 0, grip: config.normalGrip, slipAngle: 0, drifting: false };
}

// Grip the car is aiming for this frame.
function targetGrip(config, inp, speedShare) {
  let target = config.normalGrip;
  if (inp.left !== inp.right) {
    target = lerp(config.normalGrip, config.driftGrip, smoothstep(DRIFT_SPEED_START, DRIFT_SPEED_FULL, speedShare));
  }
  if (inp.handbrake) target = Math.min(target, config.handbrakeGrip);
  return target;
}

// Advance the car by dt seconds. Reads config fresh on every call.
function stepCar(car, inp, dt, config) {
  // Steering turns the car first. The velocity stays where it was, so a turned
  // car is now pointing away from where it is travelling: that gap is the slide.
  const fwdBefore = car.vx * Math.cos(car.heading) + car.vy * Math.sin(car.heading);
  const steerInput = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const steerShare = Math.abs(fwdBefore) / config.maxSpeed;
  const steerStrength = clamp(steerShare / STEER_FULL_AT, 0, 1) * (1 - 0.35 * clamp(steerShare, 0, 1));
  car.heading += steerInput * config.steerSpeed * steerStrength * (fwdBefore < 0 ? -1 : 1) * dt;

  // Split velocity into forward and sideways parts, relative to the new heading.
  const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
  let fwd = car.vx * cos + car.vy * sin;
  let lat = -car.vx * sin + car.vy * cos;

  // Gas, brake, reverse.
  if (inp.gas && !inp.brake) {
    fwd += config.acceleration * dt;
    if (fwd > config.maxSpeed) fwd = Math.max(config.maxSpeed, fwd - config.brakePower * dt);
  } else if (inp.brake && !inp.gas) {
    if (fwd > 0) fwd = Math.max(0, fwd - config.brakePower * dt);
    else fwd = Math.max(-config.maxSpeed * REVERSE_SPEED_SHARE, fwd - config.acceleration * dt);
  }
  // Drag, plus a little extra bleed under handbrake. It acts even with the gas held, so the
  // real top speed is the lower of maxSpeed and about acceleration / friction.
  fwd -= fwd * Math.min(1, (config.friction + (inp.handbrake ? HANDBRAKE_DRAG : 0)) * dt);

  // Grip eases toward its target: drops fast, recovers at gripRecoverySpeed.
  const speedShare = Math.abs(fwd) / config.maxSpeed;
  const target = targetGrip(config, inp, speedShare);
  if (target < car.grip) car.grip = Math.max(target, car.grip - GRIP_DROP_RATE * dt);
  else car.grip = Math.min(target, car.grip + config.gripRecoverySpeed * dt);

  // Grip kills sideways velocity.
  lat *= Math.exp(-car.grip * dt);

  // Back to world velocity using the (possibly turned) heading.
  const c2 = Math.cos(car.heading), s2 = Math.sin(car.heading);
  car.vx = fwd * c2 - lat * s2;
  car.vy = fwd * s2 + lat * c2;
  car.x += car.vx * dt;
  car.y += car.vy * dt;
}

/* The Circuit: a closed centreline (smoothed through the control points), a constant road
   width, and a grass verge on each side. The Wall stands at the outer edge of the verge. */
const TRACK_CONTROLS = [
  { x: 0, y: -700 }, { x: 900, y: -600 }, { x: 1500, y: -250 }, { x: 1450, y: 300 },
  { x: 900, y: 550 }, { x: 150, y: 300 }, { x: -300, y: 600 }, { x: -700, y: 800 },
  { x: -1300, y: 500 }, { x: -1450, y: -100 }, { x: -1300, y: -500 }, { x: -800, y: -600 }
];
const ROAD_WIDTH = 220;        // width of the tarmac in pixels
const VERGE_WIDTH = 60;        // grass between the road edge and the Wall
const TRACK_SAMPLES = 16;      // centreline points generated per control segment
const CHECKPOINT_COUNT = 6;    // Checkpoints spread evenly around the Circuit (the start line is separate)
const START_SETBACK = 80;      // how far behind the start line the car spawns
const CAR_RADIUS = 18;         // the car's collision circle
const IMPACT_MIN_SPEED = 40;   // wall speed (px/s) below which a touch is not worth counting

// A crossing line runs across the road at centreline sample i: its position and the direction of travel.
function lineAt(pts, i) {
  const n = pts.length, a = pts[(i + n - 1) % n], b = pts[(i + 1) % n], len = Math.hypot(b.x - a.x, b.y - a.y);
  return { x: pts[i].x, y: pts[i].y, tx: (b.x - a.x) / len, ty: (b.y - a.y) / len };
}

function createCircuit(controls, roadWidth, vergeWidth, samples, checkpointCount = CHECKPOINT_COUNT) {
  const pts = [], n = controls.length;
  for (let i = 0; i < n; i++) {
    const p0 = controls[(i + n - 1) % n], p1 = controls[i], p2 = controls[(i + 1) % n], p3 = controls[(i + 2) % n];
    for (let k = 0; k < samples; k++) {
      const t = k / samples, t2 = t * t, t3 = t2 * t;
      const spline = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      pts.push({ x: spline(p0.x, p1.x, p2.x, p3.x), y: spline(p0.y, p1.y, p2.y, p3.y) });
    }
  }
  // Checkpoints sit evenly around the loop; the start/finish line is sample 0.
  const checkpoints = [];
  for (let k = 1; k <= checkpointCount; k++) checkpoints.push(lineAt(pts, Math.round(k * pts.length / (checkpointCount + 1))));
  return {
    pts, halfRoad: roadWidth / 2, halfWall: roadWidth / 2 + vergeWidth,
    start: lineAt(pts, 0), checkpoints
  };
}
const CIRCUIT = createCircuit(TRACK_CONTROLS, ROAD_WIDTH, VERGE_WIDTH, TRACK_SAMPLES);

// Nearest point on the centreline to (x, y), and the unit vector from it to the car.
function circuitQuery(circuit, x, y) {
  const pts = circuit.pts, n = pts.length;
  let best = Infinity, cx = 0, cy = 0, bestIndex = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const abx = b.x - a.x, aby = b.y - a.y;
    const t = clamp(((x - a.x) * abx + (y - a.y) * aby) / (abx * abx + aby * aby), 0, 1);
    const px = a.x + abx * t, py = a.y + aby * t;
    const d2 = (x - px) * (x - px) + (y - py) * (y - py);
    if (d2 < best) { best = d2; cx = px; cy = py; bestIndex = i; }
  }
  const dist = Math.sqrt(best);
  let nx = 0, ny = 1;
  if (dist > 1e-6) { nx = (x - cx) / dist; ny = (y - cy) / dist; }
  return { dist, nx, ny, cx, cy, index: bestIndex };
}

function scaleVelocity(car, factor) { car.vx *= factor; car.vy *= factor; }

const DRIFT_STOPPED_SHARE = 0.5;  // a Drift also ends once speed falls below this share of minDriftSpeed

// Slip angle: the angle in degrees between where the car points and where it travels.
function slipAngleOf(car) {
  const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
  const fwd = car.vx * cos + car.vy * sin, lat = -car.vx * sin + car.vy * cos;
  return Math.atan2(Math.abs(lat), Math.abs(fwd)) * 180 / Math.PI;
}

// The one Drift flag that smoke, skid marks and scoring all read. It turns on above
// driftEnterAngle (at minDriftSpeed or faster) and off below driftExitAngle, so it holds
// steady while the slip angle hovers between the two.
function updateDrift(car, config) {
  const speed = Math.hypot(car.vx, car.vy);
  car.slipAngle = slipAngleOf(car);
  const exitAngle = Math.min(config.driftExitAngle, config.driftEnterAngle);
  if (car.drifting) {
    if (car.slipAngle < exitAngle || speed < config.minDriftSpeed * DRIFT_STOPPED_SHARE) car.drifting = false;
  } else if (speed >= config.minDriftSpeed && car.slipAngle > config.driftEnterAngle) {
    car.drifting = true;
  }
}

// Grass slows the car whenever it is mostly off the tarmac.
function applyGrass(car, circuit, dt, config) {
  const nearest = circuitQuery(circuit, car.x, car.y);
  car.surface = nearest.dist + CAR_RADIUS * 0.5 > circuit.halfRoad ? 'grass' : 'road';
  if (car.surface === 'grass') scaleVelocity(car, Math.exp(-config.grassDrag * dt));
}

// The Wall stops the car. A hit with speed into the Wall above crashSpeed is a Crash,
// anything gentler (or glancing) is a Scrape. Both slow the car; touches under
// IMPACT_MIN_SPEED just rub without being recorded.
function collideWithWall(state, dt, config) {
  const car = state.car, circuit = state.circuit;
  const nearest = circuitQuery(circuit, car.x, car.y);
  const limit = circuit.halfWall - CAR_RADIUS;
  if (nearest.dist <= limit) return;
  car.x = nearest.cx + nearest.nx * limit;      // push back inside
  car.y = nearest.cy + nearest.ny * limit;
  const intoWall = car.vx * nearest.nx + car.vy * nearest.ny;
  if (intoWall > 0) {
    car.vx -= (1 + config.wallBounce) * intoWall * nearest.nx;
    car.vy -= (1 + config.wallBounce) * intoWall * nearest.ny;
  }
  scaleVelocity(car, Math.exp(-config.wallScrapeDrag * dt));
  if (intoWall < IMPACT_MIN_SPEED) return;
  const crash = intoWall > config.crashSpeed;
  if (crash) { scaleVelocity(car, config.crashSpeedKept); state.crashCount++; }
  else state.scrapeCount++;
  state.lastImpact = { type: crash ? 'crash' : 'scrape', speed: intoWall, time: state.time };
}
// @sim-end

/* ==================================================================
   GAME LOGIC - the single simulation step the whole game runs through.
   ================================================================== */
// @sim-begin
const SMOKE_PER_SECOND = 45;   // smoke puffs per rear wheel per second while Drifting
const SMOKE_LIFE = 0.9;        // seconds a puff lasts
const SKID_LIFE = 25;          // seconds before a skid mark has faded away
const SKID_MAX = 2500;         // most skid mark segments kept at once
const SKID_MIN_STEP = 2;       // pixels a wheel must move before a new mark segment is laid
const REAR_WHEELS = [{ x: -14.5, y: -12 }, { x: -14.5, y: 12 }];   // car-local wheel centres
const SMOKE_DAMPING = 2;       // how quickly a puff loses its speed (per second)
const SMOKE_INHERIT = 0.1;     // share of the car's velocity a new puff starts with
const SMOKE_SPREAD = 40;       // random sideways kick given to a new puff (px/s)

/* ---- Effects: smoke and skid marks (kept DOM-free so the tests can run them) ---- */

// World positions of the car's rear wheels.
function rearWheelPositions(car) {
  const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
  return REAR_WHEELS.map(w => ({ x: car.x + w.x * cos - w.y * sin, y: car.y + w.x * sin + w.y * cos }));
}

function nextRandom(fx) {   // tiny seeded generator, so effects are repeatable
  fx.seed = (Math.imul(fx.seed, 1664525) + 1013904223) >>> 0;
  return fx.seed / 4294967296;
}

// Smoke and skid marks. Both appear only while the car is Drifting.
function updateEffects(state, dt) {
  const fx = state.effects, car = state.car;
  for (const p of fx.smoke) {
    const damp = Math.exp(-SMOKE_DAMPING * dt);
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp; p.age += dt;
  }
  fx.smoke = fx.smoke.filter(p => p.age < SMOKE_LIFE);
  let expired = 0;
  while (expired < fx.skids.length && state.time - fx.skids[expired].t > SKID_LIFE) expired++;
  if (expired) fx.skids.splice(0, expired);

  fx.smokeCarry = car.drifting ? fx.smokeCarry + SMOKE_PER_SECOND * dt : 0;
  const puffs = Math.floor(fx.smokeCarry);
  fx.smokeCarry -= puffs;
  rearWheelPositions(car).forEach(({ x, y }, i) => {
    if (!car.drifting) { fx.wheels[i] = null; return; }
    const prev = fx.wheels[i];
    if (!prev) fx.wheels[i] = { x, y };
    else if (Math.hypot(x - prev.x, y - prev.y) >= SKID_MIN_STEP) {
      fx.skids.push({ x1: prev.x, y1: prev.y, x2: x, y2: y, t: state.time });
      fx.wheels[i] = { x, y };
    }
    for (let n = 0; n < puffs; n++) {
      fx.smoke.push({ x, y, vx: car.vx * SMOKE_INHERIT + (nextRandom(fx) - 0.5) * SMOKE_SPREAD, vy: car.vy * SMOKE_INHERIT + (nextRandom(fx) - 0.5) * SMOKE_SPREAD, age: 0 });
    }
  });
  if (fx.skids.length > SKID_MAX) fx.skids.splice(0, fx.skids.length - SKID_MAX);
}

/* ---- Scoring: Drift Chains, Combo Multiplier, banking ---- */

function createScoring() {
  return { total: 0, pending: 0, multiplier: 1, chainTime: 0, timeSinceDrift: 0, bestChain: 0, crashesSeen: 0 };
}

// Ends the current chain without banking it (used after a Crash, and as part of banking).
function resetChain(sc) { sc.pending = 0; sc.multiplier = 1; sc.chainTime = 0; sc.timeSinceDrift = 0; }

function bankChain(sc) {
  sc.total += sc.pending;
  sc.bestChain = Math.max(sc.bestChain, sc.pending);
  resetChain(sc);
}

// Drifting builds the chain; a pause shorter than comboTimeout does not end it.
function updateScoring(state, dt, config) {
  const sc = state.scoring;
  if (state.crashCount !== sc.crashesSeen) {   // a Crash loses the pending points
    sc.crashesSeen = state.crashCount;
    resetChain(sc);
  }
  if (state.car.drifting) {
    sc.timeSinceDrift = 0;
    sc.chainTime += dt;
    sc.multiplier = 1 + Math.floor(sc.chainTime / config.comboStepTime);
    sc.pending += config.driftScoreRate * sc.multiplier * dt;
  } else if (sc.pending > 0) {
    sc.timeSinceDrift += dt;
    if (sc.timeSinceDrift >= config.comboTimeout) bankChain(sc);
  }
}

/* ---- Laps: start/finish line, ordered Checkpoints, lap timer ---- */

const NOT_CROSSED = 0, FORWARD = 1, BACKWARD = -1;   // results of lineCrossing

// Did moving from (x0, y0) to (x1, y1) cross the line? FORWARD, BACKWARD, or NOT_CROSSED.
function lineCrossing(line, halfWidth, x0, y0, x1, y1) {
  const s0 = (x0 - line.x) * line.tx + (y0 - line.y) * line.ty;
  const s1 = (x1 - line.x) * line.tx + (y1 - line.y) * line.ty;
  if ((s0 < 0) === (s1 < 0)) return NOT_CROSSED;
  const t = s0 / (s0 - s1);
  const sideways = (x0 + (x1 - x0) * t - line.x) * -line.ty + (y0 + (y1 - y0) * t - line.y) * line.tx;
  if (Math.abs(sideways) > halfWidth) return NOT_CROSSED;
  return s1 >= 0 ? FORWARD : BACKWARD;
}

function createLap() {
  return { started: false, startTime: 0, nextCheckpoint: 0, count: 0, lastLapTime: null, bestLapTime: null, lastX: 0, lastY: 0 };
}

function currentLapTime(state) { return state.lap.started ? state.time - state.lap.startTime : 0; }

// Called after every step, with the car having moved from where the last step left it. Only
// forward crossings count: the first of the line starts the timer, Checkpoints must come in
// order, and the line then finishes a Lap. Deliberately placing the car (a respawn) must also
// set lap.lastX and lap.lastY, so that the jump is not mistaken for driving across a line.
function updateLap(state) {
  const lap = state.lap, car = state.car, circuit = state.circuit, px = lap.lastX, py = lap.lastY;
  lap.lastX = car.x; lap.lastY = car.y;
  if (lineCrossing(circuit.start, circuit.halfWall, px, py, car.x, car.y) === FORWARD) {
    if (!lap.started) {
      lap.started = true;
      lap.startTime = state.time;
      lap.nextCheckpoint = 0;
    } else if (lap.nextCheckpoint === circuit.checkpoints.length) {
      const lapTime = state.time - lap.startTime;
      lap.count++;
      lap.lastLapTime = lapTime;
      lap.bestLapTime = lap.bestLapTime === null ? lapTime : Math.min(lap.bestLapTime, lapTime);
      lap.startTime = state.time;
      lap.nextCheckpoint = 0;
    }
  }
  if (lap.started && lap.nextCheckpoint < circuit.checkpoints.length &&
      lineCrossing(circuit.checkpoints[lap.nextCheckpoint], circuit.halfWall, px, py, car.x, car.y) === FORWARD) {
    lap.nextCheckpoint++;
  }
}

/* ---- Records: best lap and best score, kept between visits ---- */

function createRecords() { return { bestLap: null, bestScore: 0 }; }

const MIN_SAVED_LAP = 1, MAX_SAVED_LAP = 3600;   // seconds: a saved best lap outside this is not believable
const MAX_SAVED_SCORE = 1e9;                      // points: likewise for a saved best score

const isNumberBetween = (v, lo, hi) => typeof v === 'number' && isFinite(v) && v >= lo && v <= hi;

// Reads saved Records back, ignoring anything that is not a believable number.
function parseRecords(text) {
  const records = createRecords();
  try {
    const saved = JSON.parse(text);
    if (saved && typeof saved === 'object') {
      if (isNumberBetween(saved.bestLap, MIN_SAVED_LAP, MAX_SAVED_LAP)) records.bestLap = saved.bestLap;
      if (isNumberBetween(saved.bestScore, 1, MAX_SAVED_SCORE)) records.bestScore = saved.bestScore;
    }
  } catch (e) { /* nothing saved, or damaged: start empty */ }
  return records;
}

// Records only ever improve.
function updateRecords(state) {
  const records = state.records, best = state.lap.bestLapTime, total = state.scoring.total;
  if (best !== null && (records.bestLap === null || best < records.bestLap)) records.bestLap = best;
  if (total > records.bestScore) records.bestScore = total;
}

/* ---- Respawn (R): back to the last passed Checkpoint, or the start ---- */

// The start position: just behind the start/finish line, facing along the road.
function startSpot(circuit) {
  const line = circuit.start;
  return { x: line.x - line.tx * START_SETBACK, y: line.y - line.ty * START_SETBACK, tx: line.tx, ty: line.ty };
}

// Where R puts the car: the last passed Checkpoint, or the start position if there is none.
function respawnSpot(state) {
  const lap = state.lap, circuit = state.circuit;
  return lap.nextCheckpoint > 0 ? circuit.checkpoints[lap.nextCheckpoint - 1] : startSpot(circuit);
}

// Stationary at the spot, facing along the road. The pending Drift Chain is ended without
// banking, but the lap timer and Checkpoint progress carry on. The jump is not driving, so
// the lap code is told where the car now is, and skid marks are not joined across it.
function respawnCar(state, config) {
  const car = state.car, spot = respawnSpot(state);
  car.x = spot.x; car.y = spot.y; car.heading = Math.atan2(spot.ty, spot.tx);
  car.vx = 0; car.vy = 0; car.grip = config.normalGrip;
  car.drifting = false; car.slipAngle = 0;
  state.lap.lastX = car.x; state.lap.lastY = car.y;
  state.effects.wheels = [null, null];
  resetChain(state.scoring);
}

function createGameState(config, records = createRecords()) {
  const spot = startSpot(CIRCUIT);
  const car = createCarState(config, spot.x, spot.y, Math.atan2(spot.ty, spot.tx));
  car.surface = 'road';       // 'road' or 'grass'
  const lap = createLap();
  lap.lastX = car.x; lap.lastY = car.y;
  lap.bestLapTime = records.bestLap;   // the saved best lap is the time to beat
  return {
    time: 0, car, circuit: CIRCUIT, lastImpact: null, crashCount: 0, scrapeCount: 0, scoring: createScoring(), lap, records, respawnHeld: false,
    effects: { smoke: [], skids: [], wheels: [null, null], smokeCarry: 0, seed: 1 }
  };
}

// Advance the whole game by dt seconds.
function step(state, inp, dt, config) {
  if (inp.respawn && !state.respawnHeld) respawnCar(state, config);   // once per key press
  state.respawnHeld = !!inp.respawn;
  stepCar(state.car, inp, dt, config);
  applyGrass(state.car, state.circuit, dt, config);
  collideWithWall(state, dt, config);
  updateDrift(state.car, config);
  updateScoring(state, dt, config);
  state.time += dt;
  updateLap(state);
  updateRecords(state);
  updateEffects(state, dt);
}
// @sim-end

const PX_TO_KMH = 0.18;  // display only: converts pixels per second to km/h-style units
const MAX_SUBSTEP = 1 / 120;
/* ---- Persistence: Records live under their own key, apart from the Tuning Panel's values ---- */
const RECORDS_KEY = 'drift.records.v1';
function loadRecords() {
  try { return parseRecords(localStorage.getItem(RECORDS_KEY)); } catch (e) { return createRecords(); }
}
let savedRecords = '';
function saveRecordsIfChanged() {
  const text = JSON.stringify(game.records);
  if (text === savedRecords) return;
  try {
    localStorage.setItem(RECORDS_KEY, text);
    savedRecords = text;   // only once it is really saved, so a failed write is tried again
  } catch (e) { /* storage unavailable: try again on a later frame */ }
}

const game = createGameState(CONFIG, loadRecords());
savedRecords = JSON.stringify(game.records);

/* ==================================================================
   RENDERING - canvas drawing, camera, HUD.
   ================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hudSpeed = document.getElementById('hudSpeed');
const hudDrift = document.getElementById('hudDrift');
const hudTotal = document.getElementById('hudTotal');
const hudChain = document.getElementById('hudChain');
const hudBest = document.getElementById('hudBest');
const hudBestScore = document.getElementById('hudBestScore');
const hudLapNo = document.getElementById('hudLapNo');
const hudLapTime = document.getElementById('hudLapTime');
const hudLapLast = document.getElementById('hudLapLast');
const hudLapBest = document.getElementById('hudLapBest');
const hudLapCp = document.getElementById('hudLapCp');
const camera = { x: 0, y: 0 };
const CAMERA_LOOKAHEAD = 0.3;   // seconds of velocity the camera leads by
const CAMERA_STIFFNESS = 5;     // how tightly the camera follows (higher = snappier)
const TILE = 200;
const WALL_THICKNESS = 10;  // how thick the Wall is drawn (looks only)

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
}
window.addEventListener('resize', resize);
resize();

function updateCamera(dt) {
  const car = game.car;
  const tx = car.x + car.vx * CAMERA_LOOKAHEAD;
  const ty = car.y + car.vy * CAMERA_LOOKAHEAD;
  const k = 1 - Math.exp(-CAMERA_STIFFNESS * dt);
  camera.x += (tx - camera.x) * k;
  camera.y += (ty - camera.y) * k;
}

function drawGround(w, h) {
  ctx.fillStyle = '#2f6b2f';
  ctx.fillRect(0, 0, w, h);
  // Checker tiles so movement is visible on open ground.
  ctx.fillStyle = '#357535';
  const x0 = Math.floor((camera.x - w / 2) / TILE), x1 = Math.ceil((camera.x + w / 2) / TILE);
  const y0 = Math.floor((camera.y - h / 2) / TILE), y1 = Math.ceil((camera.y + h / 2) / TILE);
  for (let tx = x0; tx < x1; tx++) {
    for (let ty = y0; ty < y1; ty++) {
      if ((tx + ty) & 1) ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
    }
  }
}

function tracePath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
}

// Wall, grass verge, road, centre dashes and the start/finish line.
function drawCircuit() {
  const c = game.circuit, pts = c.pts;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  tracePath(pts);
  ctx.strokeStyle = '#e8e8e8';                        // Wall
  ctx.lineWidth = (c.halfWall + WALL_THICKNESS) * 2;
  ctx.stroke();
  ctx.strokeStyle = '#3f8a3f';                        // grass verge
  ctx.lineWidth = c.halfWall * 2;
  ctx.stroke();
  ctx.strokeStyle = '#4a4d52';                        // road
  ctx.lineWidth = c.halfRoad * 2;
  ctx.stroke();
  game.circuit.checkpoints.forEach((line, i) => {        // Checkpoint lines, the next one due in yellow
    const due = game.lap.started && i === game.lap.nextCheckpoint;
    ctx.strokeStyle = due ? 'rgba(255,209,102,0.75)' : 'rgba(255,255,255,0.16)';
    ctx.lineWidth = due ? 6 : 4;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(line.x + line.ty * c.halfRoad, line.y - line.tx * c.halfRoad);
    ctx.lineTo(line.x - line.ty * c.halfRoad, line.y + line.tx * c.halfRoad);
    ctx.stroke();
  });
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';         // centre dashes
  ctx.lineWidth = 4;
  ctx.setLineDash([40, 40]);
  ctx.stroke();
  ctx.setLineDash([]);
  const st = c.start;                                 // start/finish line
  ctx.save();
  ctx.translate(st.x, st.y);
  ctx.rotate(Math.atan2(st.ty, st.tx));
  const cell = 14, rows = Math.ceil(c.halfRoad * 2 / cell);
  for (let r = 0; r < rows; r++) {
    for (let k = 0; k < 2; k++) {
      ctx.fillStyle = (r + k) & 1 ? '#fff' : '#111';
      ctx.fillRect(k * cell - cell, -c.halfRoad + r * cell, cell, cell);
    }
  }
  ctx.restore();
}

// Skid marks fade out over SKID_LIFE seconds. Segments are batched into a few
// opacity levels so thousands of them cost only a handful of draw calls.
const SKID_FADE_LEVELS = 8;
function drawSkids() {
  const buckets = Array.from({ length: SKID_FADE_LEVELS }, () => []);
  for (const m of game.effects.skids) {
    const fade = 1 - (game.time - m.t) / SKID_LIFE;
    if (fade > 0) buckets[Math.min(SKID_FADE_LEVELS - 1, Math.floor(fade * SKID_FADE_LEVELS))].push(m);
  }
  ctx.lineCap = 'round';
  ctx.lineWidth = 4;
  buckets.forEach((marks, level) => {
    if (!marks.length) return;
    ctx.strokeStyle = 'rgba(12,12,14,' + (0.55 * (level + 0.5) / SKID_FADE_LEVELS).toFixed(3) + ')';
    ctx.beginPath();
    for (const m of marks) { ctx.moveTo(m.x1, m.y1); ctx.lineTo(m.x2, m.y2); }
    ctx.stroke();
  });
}

// Smoke puffs grow and thin out as they age.
function drawSmoke() {
  for (const p of game.effects.smoke) {
    const life = p.age / SMOKE_LIFE;
    ctx.fillStyle = 'rgba(235,235,238,' + (0.42 * (1 - life)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6 + 18 * life, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCar() {
  const car = game.car;
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.heading);
  ctx.fillStyle = '#d62828';           // body
  ctx.fillRect(-22, -11, 44, 22);
  ctx.fillStyle = '#8ecae6';           // windscreen
  ctx.fillRect(2, -8, 9, 16);
  ctx.fillStyle = '#f7f7f7';           // headlights
  ctx.fillRect(20, -9, 3, 5);
  ctx.fillRect(20, 4, 3, 5);
  ctx.fillStyle = '#111';              // wheels
  ctx.fillRect(10, -14, 9, 4); ctx.fillRect(10, 10, 9, 4);
  ctx.fillRect(-19, -14, 9, 4); ctx.fillRect(-19, 10, 9, 4);
  ctx.restore();
}

// m:ss.mmm, or dashes when there is no time yet.
function formatTime(seconds) {
  if (seconds === null || seconds === undefined) return '--:--.---';
  const totalMs = Math.round(seconds * 1000);   // round once, so 59.9996 s reads 1:00.000, never 0:60.000
  const m = Math.floor(totalMs / 60000), sec = Math.floor(totalMs % 60000 / 1000), ms = totalMs % 1000;
  return m + ':' + String(sec).padStart(2, '0') + '.' + String(ms).padStart(3, '0');
}

const formatPoints = points => Math.floor(points).toLocaleString();   // whole points, with thousands separators

function render() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  ctx.translate(w / 2 - camera.x, h / 2 - camera.y);
  drawGround(w, h);
  drawCircuit();
  drawSkids();
  drawCar();
  drawSmoke();
  ctx.restore();
  const speed = Math.hypot(game.car.vx, game.car.vy);
  hudSpeed.textContent = Math.round(speed * PX_TO_KMH);
  const sc = game.scoring;
  hudTotal.textContent = formatPoints(sc.total);
  hudChain.textContent = sc.pending > 0 ? '+' + formatPoints(sc.pending) + '  \u00d7' + sc.multiplier : '';
  hudBest.textContent = 'Best chain ' + formatPoints(sc.bestChain);
  hudBestScore.textContent = 'Best score ' + formatPoints(game.records.bestScore);
  const lap = game.lap;
  hudLapNo.textContent = lap.started ? 'LAP ' + (lap.count + 1) : 'CROSS THE LINE TO START';
  hudLapTime.textContent = lap.started ? formatTime(currentLapTime(game)) : '--:--.---';
  hudLapLast.textContent = 'Last ' + formatTime(lap.lastLapTime);
  hudLapBest.textContent = 'Best ' + formatTime(lap.bestLapTime);
  hudLapCp.textContent = lap.started ? 'Checkpoint ' + lap.nextCheckpoint + '/' + game.circuit.checkpoints.length : '';
  hudDrift.textContent = game.car.drifting ? 'DRIFT ' + Math.round(game.car.slipAngle) + '\u00b0' : '';
}

/* ==================================================================
   GAME LOOP - requestAnimationFrame with delta time.
   ================================================================== */
let lastTime = performance.now();
function frame(now) {
  let dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  const steps = Math.max(1, Math.ceil(dt / MAX_SUBSTEP));
  for (let i = 0; i < steps; i++) step(game, input, dt / steps, CONFIG);
  updateCamera(dt);
  saveRecordsIfChanged();
  render();
  requestAnimationFrame(frame);
}
camera.x = game.car.x; camera.y = game.car.y;
requestAnimationFrame(frame);

/* ==================================================================
   TUNING PANEL - HTML/CSS overlay with one slider per CONFIG value.
   Moving a slider changes CONFIG at once, so the game reacts instantly.
   ================================================================== */
(function initTuningPanel() {
  const TUNING_KEY = 'drift.tuning.v1';   // slider values
  const PANEL_KEY = 'drift.panel.v1';     // panel open state and position
  const GROUPS = ['Speed', 'Steering', 'Grip', 'Drift Score'];

  function loadJSON(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ } }
  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    for (const c of children) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    return node;
  }
  const decimalsOf = step => (String(step).split('.')[1] || '').length;
  // Round to a little more than the slider step, so float noise like 0.30000000000000004 never shows.
  const roundToStep = (key, v) => Number(v.toFixed(decimalsOf(CONFIG_META[key].step) + 2));
  const dropFocus = node => node.blur();   // so the arrow keys go back to driving the car

  // Restore saved slider values (ignoring anything unknown or out of range).
  const saved = loadJSON(TUNING_KEY);
  if (saved && typeof saved === 'object') {
    for (const key in CONFIG_META) {
      const v = saved[key], m = CONFIG_META[key];
      if (typeof v === 'number' && isFinite(v)) CONFIG[key] = clamp(v, m.min, m.max);
    }
  }
  const saveTuning = () => saveJSON(TUNING_KEY, CONFIG);

  // ---- Build the panel ----
  const gear = el('button', { id: 'gear', type: 'button', title: 'Tuning panel (H)', textContent: '\u2699' });
  const collapseBtn = el('button', { type: 'button', title: 'Collapse', textContent: '\u2212' });
  const title = el('div', { id: 'panelTitle' }, [el('span', { textContent: 'TUNING' }), collapseBtn]);
  const body = el('div', { id: 'panelBody' });
  const panel = el('div', { id: 'panel' }, [title, body]);
  const sliders = {};   // key -> { input, value }

  for (const group of GROUPS) {
    body.appendChild(el('h4', { textContent: group }));
    for (const key in CONFIG_META) {
      const m = CONFIG_META[key];
      if (m.group !== group) continue;
      const decimals = decimalsOf(m.step);
      const input = el('input', { type: 'range', min: m.min, max: m.max, step: m.step, value: CONFIG[key] });
      const value = el('span', { className: 'val', textContent: CONFIG[key].toFixed(decimals) });
      body.appendChild(el('div', { className: 'row' }, [el('div', { className: 'top' }, [el('span', { textContent: key }), value]), input]));
      sliders[key] = { input, value, decimals };
      input.addEventListener('input', () => {
        CONFIG[key] = roundToStep(key, Number(input.value));
        value.textContent = CONFIG[key].toFixed(decimals);
        presetSelect.value = '';
        saveTuning();
      });
      // Blur after a click or drag so the arrow keys keep driving the car.
      input.addEventListener('change', () => dropFocus(input));
      input.addEventListener('pointerup', () => dropFocus(input));
    }
  }

  function showValues() {
    for (const key in sliders) {
      const s = sliders[key];
      s.input.value = CONFIG[key];
      s.value.textContent = CONFIG[key].toFixed(s.decimals);
    }
  }

  const presetSelect = el('select', {}, [el('option', { value: '', textContent: 'Presets\u2026' }),
    ...Object.keys(PRESETS).map(name => el('option', { value: name, textContent: name }))]);
  presetSelect.addEventListener('change', () => {
    const preset = PRESETS[presetSelect.value];
    if (preset) { Object.assign(CONFIG, DEFAULT_CONFIG, preset); showValues(); saveTuning(); }
    dropFocus(presetSelect);
  });

  const resetBtn = el('button', { type: 'button', textContent: 'Reset' });
  resetBtn.addEventListener('click', () => {
    Object.assign(CONFIG, DEFAULT_CONFIG);
    presetSelect.value = '';
    showValues(); saveTuning(); dropFocus(resetBtn);
  });

  const copyBtn = el('button', { type: 'button', textContent: 'Copy Config' });
  copyBtn.addEventListener('click', () => {
    const text = '{\n' + Object.keys(CONFIG_META).map(k => '  ' + k + ': ' + CONFIG[k]).join(',\n') + '\n}';
    const done = () => { copyBtn.textContent = 'Copied!'; setTimeout(() => { copyBtn.textContent = 'Copy Config'; }, 1200); };
    const failed = () => { copyBtn.textContent = 'Copy failed'; setTimeout(() => { copyBtn.textContent = 'Copy Config'; }, 1500); };
    const fallback = () => {   // clipboard API needs a secure page; double-clicked files are not
      const ta = el('textarea', { value: text });
      ta.style.cssText = 'position:fixed;left:-9999px;opacity:0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { /* ok stays false */ }
      ta.remove();
      if (ok) done(); else failed();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
    dropFocus(copyBtn);
  });

  body.appendChild(presetSelect);
  body.appendChild(el('div', { className: 'actions' }, [resetBtn, copyBtn]));
  document.body.appendChild(panel);
  document.body.appendChild(gear);

  // ---- Open, collapse, drag, remember ----
  const panelState = Object.assign({ open: true, collapsed: false, left: null, top: null }, loadJSON(PANEL_KEY));
  const saveUI = () => saveJSON(PANEL_KEY, panelState);
  function applyUI() {
    panel.classList.toggle('hidden', !panelState.open);
    panel.classList.toggle('collapsed', panelState.collapsed);
    collapseBtn.textContent = panelState.collapsed ? '+' : '\u2212';
    if (typeof panelState.left === 'number' && typeof panelState.top === 'number') {
      panel.style.right = 'auto';
      panel.style.left = clamp(panelState.left, 0, Math.max(0, window.innerWidth - 60)) + 'px';
      panel.style.top = clamp(panelState.top, 0, Math.max(0, window.innerHeight - 40)) + 'px';
    }
  }
  function togglePanel() { panelState.open = !panelState.open; applyUI(); saveUI(); }
  applyUI();

  gear.addEventListener('click', () => { togglePanel(); dropFocus(gear); });
  collapseBtn.addEventListener('click', () => { panelState.collapsed = !panelState.collapsed; applyUI(); saveUI(); dropFocus(collapseBtn); });
  window.addEventListener('keydown', e => {
    if (e.code !== 'KeyH' || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();                       // H must not type or move anything else
    togglePanel();
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  });

  let drag = null;
  title.addEventListener('pointerdown', e => {
    if (e.target === collapseBtn) return;
    const r = panel.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    title.setPointerCapture(e.pointerId);
  });
  title.addEventListener('pointermove', e => {
    if (!drag) return;
    panelState.left = clamp(e.clientX - drag.dx, 0, Math.max(0, window.innerWidth - 60));
    panelState.top = clamp(e.clientY - drag.dy, 0, Math.max(0, window.innerHeight - 40));
    applyUI();
  });
  const endDrag = () => { if (drag) { drag = null; saveUI(); } };
  title.addEventListener('pointerup', endDrag);
  title.addEventListener('pointercancel', endDrag);
  title.addEventListener('lostpointercapture', endDrag);
  window.addEventListener('resize', applyUI);   // keeps a dragged panel on screen

  // Moving focus into the panel must never leave a driving key stuck on.
  panel.addEventListener('focusin', () => { for (const k in input) input[k] = false; });

  // Clicks and wheel on the panel never reach the game.
  for (const node of [panel, gear]) {
    for (const type of ['pointerdown', 'mousedown', 'click', 'dblclick', 'contextmenu', 'wheel']) {
      node.addEventListener(type, e => e.stopPropagation());
    }
  }
})();
</script>
</body>
</html>
