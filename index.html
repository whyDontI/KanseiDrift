<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drift</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* ==================================================================
   CONFIG - every handling number lives here. Physics reads these
   every frame, so changing a value takes effect immediately.
   ================================================================== */
// @sim-begin
const CONFIG = {
  // --- Speed ---
  maxSpeed: 620,          // top forward speed in pixels per second
  acceleration: 520,      // how fast gas adds speed (px/s per second)
  brakePower: 950,        // how hard brake slows you down (px/s per second)
  friction: 0.7,          // rolling drag: share of speed lost per second with no gas
  crashSpeed: 260,        // speed into a wall (px/s) above which a hit is a Crash, not a Scrape
  grassDrag: 1.6,         // extra drag per second while the car is mostly on grass
  wallBounce: 0.2,        // share of the speed into a wall that bounces back
  wallScrapeDrag: 2.5,    // speed lost per second while rubbing along a wall
  crashSpeedKept: 0.55,   // share of speed the car keeps after a Crash
  // --- Steering ---
  steerSpeed: 2.6,        // turn rate in radians per second at full lock
  // --- Grip ---
  normalGrip: 9,          // sideways grip while driving normally (higher = stickier)
  driftGrip: 4.5,         // sideways grip when steering hard at speed (lower = slidier)
  handbrakeGrip: 2.5,     // sideways grip while Space is held
  gripRecoverySpeed: 8,   // how fast grip returns once you straighten up (per second)
  // --- Drift Score ---
  driftScoreRate: 10,     // points per second while drifting (used by scoring)
  comboTimeout: 1.5       // seconds without drifting before the chain ends
};

// Frozen copy of the starting values, used by the Tuning Panel's Reset and presets.
const DEFAULT_CONFIG = Object.freeze({ ...CONFIG });

// Slider definitions for the Tuning Panel: one entry per CONFIG value.
const CONFIG_META = {
  maxSpeed:          { group: 'Speed',       min: 200,  max: 1200, step: 10 },
  acceleration:      { group: 'Speed',       min: 100,  max: 1500, step: 10 },
  brakePower:        { group: 'Speed',       min: 200,  max: 2000, step: 10 },
  friction:          { group: 'Speed',       min: 0,    max: 3,    step: 0.05 },
  crashSpeed:        { group: 'Speed',       min: 50,   max: 800,  step: 10 },
  grassDrag:         { group: 'Speed',       min: 0,    max: 6,    step: 0.1 },
  wallBounce:        { group: 'Speed',       min: 0,    max: 1,    step: 0.05 },
  wallScrapeDrag:    { group: 'Speed',       min: 0,    max: 8,    step: 0.1 },
  crashSpeedKept:    { group: 'Speed',       min: 0.1,  max: 1,    step: 0.05 },
  steerSpeed:        { group: 'Steering',    min: 0.5,  max: 5,    step: 0.1 },
  normalGrip:        { group: 'Grip',        min: 1,    max: 20,   step: 0.5 },
  driftGrip:         { group: 'Grip',        min: 0.2,  max: 15,   step: 0.1 },
  handbrakeGrip:     { group: 'Grip',        min: 0.1,  max: 10,   step: 0.1 },
  gripRecoverySpeed: { group: 'Grip',        min: 0.5,  max: 20,   step: 0.5 },
  driftScoreRate:    { group: 'Drift Score', min: 1,    max: 100,  step: 1 },
  comboTimeout:      { group: 'Drift Score', min: 0.2,  max: 5,    step: 0.1 }
};

// Presets only set sliders; anything they leave out goes back to the default.
const PRESETS = {
  'Arcade':        { normalGrip: 7,  driftGrip: 3.5, handbrakeGrip: 2,   gripRecoverySpeed: 10, steerSpeed: 2.8, acceleration: 600 },
  'Realistic':     { normalGrip: 12, driftGrip: 8,   handbrakeGrip: 4,   gripRecoverySpeed: 12, steerSpeed: 2.3 },
  'Sideways Mode': { normalGrip: 5,  driftGrip: 1.2, handbrakeGrip: 0.6, gripRecoverySpeed: 3,  steerSpeed: 2.9, friction: 0.5, acceleration: 600 }
};
// @sim-end
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2f6b2f; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 16px; bottom: 16px; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #hud .big { font-size: 40px; font-weight: 700; }
  #hud .small { font-size: 14px; opacity: .8; }
  #gear { position: fixed; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: rgba(15,18,24,.78); color: #fff; font-size: 20px; line-height: 36px; padding: 0; cursor: pointer; z-index: 11; }
  #gear:hover { background: rgba(40,46,58,.9); }
  #panel { position: fixed; top: 58px; right: 12px; width: 270px; max-height: calc(100vh - 80px); display: flex; flex-direction: column;
    background: rgba(15,18,24,.78); color: #e8eaed; border-radius: 8px; font-size: 12px; z-index: 10; user-select: none; }
  #panel.hidden { display: none; }
  #panelTitle { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; cursor: move;
    font-weight: 700; letter-spacing: .04em; border-bottom: 1px solid rgba(255,255,255,.12); }
  #panelTitle button { background: none; border: 0; color: inherit; font-size: 16px; cursor: pointer; padding: 0 4px; }
  #panelBody { overflow-y: auto; padding: 6px 10px 10px; }
  #panel.collapsed #panelBody { display: none; }
  #panel h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8ecae6; }
  #panel .row { margin: 4px 0; }
  #panel .row .top { display: flex; justify-content: space-between; }
  #panel .row .val { font-variant-numeric: tabular-nums; color: #fff; }
  #panel input[type=range] { width: 100%; margin: 2px 0 0; }
  #panel .actions { display: flex; gap: 6px; margin-top: 10px; }
  #panel .actions button, #panel select { flex: 1; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2);
    border-radius: 4px; padding: 5px 6px; font-size: 12px; cursor: pointer; }
  #panel select { width: 100%; margin-top: 8px; flex: none; }
  #panel select option { color: #000; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div><span class="big" id="hudSpeed">0</span> <span class="small">km/h</span></div></div>

<script>
/* ==================================================================
   INPUT - keyboard state. Driving keys never scroll the page.
   ================================================================== */
const input = { gas: false, brake: false, left: false, right: false, handbrake: false };
const KEY_MAP = {
  KeyW: 'gas', ArrowUp: 'gas',
  KeyS: 'brake', ArrowDown: 'brake',
  KeyA: 'left', ArrowLeft: 'left',
  KeyD: 'right', ArrowRight: 'right',
  Space: 'handbrake'
};
window.addEventListener('keydown', e => {
  const k = KEY_MAP[e.code];
  if (!k) return;
  e.preventDefault();
  input[k] = true;
});
window.addEventListener('keyup', e => {
  const k = KEY_MAP[e.code];
  if (!k) return;
  e.preventDefault();
  input[k] = false;
});
window.addEventListener('blur', () => { for (const k in input) input[k] = false; });

/* ==================================================================
   PHYSICS - DOM-free. Velocity, heading and sideways grip.
   Everything between the @sim markers can be run headlessly by tests.
   ================================================================== */
// @sim-begin
const GRIP_DROP_RATE = 60;        // how fast grip falls to a lower target (per second)
const HANDBRAKE_DRAG = 0.4;       // extra speed share lost per second under handbrake
const REVERSE_SPEED_SHARE = 0.4;  // reverse top speed as a share of maxSpeed
const DRIFT_SPEED_START = 0.5;    // speed share where hard steering starts to cut grip
const DRIFT_SPEED_FULL = 0.8;     // speed share where hard steering gives full driftGrip
const STEER_FULL_AT = 0.12;       // speed share where steering reaches full strength

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(a, b, v) { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

function createCarState(config, x = 0, y = 0, heading = 0) {
  return { x, y, heading, vx: 0, vy: 0, grip: config.normalGrip };
}

// Grip the car is aiming for this frame.
function targetGrip(config, inp, speedShare) {
  let target = config.normalGrip;
  if (inp.left !== inp.right) {
    target = lerp(config.normalGrip, config.driftGrip, smoothstep(DRIFT_SPEED_START, DRIFT_SPEED_FULL, speedShare));
  }
  if (inp.handbrake) target = Math.min(target, config.handbrakeGrip);
  return target;
}

// Advance the car by dt seconds. Reads config fresh on every call.
function stepCar(car, inp, dt, config) {
  // Steering turns the car first. The velocity stays where it was, so a turned
  // car is now pointing away from where it is travelling: that gap is the slide.
  const fwdBefore = car.vx * Math.cos(car.heading) + car.vy * Math.sin(car.heading);
  const steerInput = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const steerShare = Math.abs(fwdBefore) / config.maxSpeed;
  const steerStrength = clamp(steerShare / STEER_FULL_AT, 0, 1) * (1 - 0.35 * clamp(steerShare, 0, 1));
  car.heading += steerInput * config.steerSpeed * steerStrength * (fwdBefore < 0 ? -1 : 1) * dt;

  // Split velocity into forward and sideways parts, relative to the new heading.
  const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
  let fwd = car.vx * cos + car.vy * sin;
  let lat = -car.vx * sin + car.vy * cos;

  // Gas, brake, reverse.
  if (inp.gas && !inp.brake) {
    fwd += config.acceleration * dt;
    if (fwd > config.maxSpeed) fwd = Math.max(config.maxSpeed, fwd - config.brakePower * dt);
  } else if (inp.brake && !inp.gas) {
    if (fwd > 0) fwd = Math.max(0, fwd - config.brakePower * dt);
    else fwd = Math.max(-config.maxSpeed * REVERSE_SPEED_SHARE, fwd - config.acceleration * dt);
  }
  // Rolling drag, plus a little extra bleed under handbrake.
  fwd -= fwd * Math.min(1, (config.friction + (inp.handbrake ? HANDBRAKE_DRAG : 0)) * dt);

  // Grip eases toward its target: drops fast, recovers at gripRecoverySpeed.
  const speedShare = Math.abs(fwd) / config.maxSpeed;
  const target = targetGrip(config, inp, speedShare);
  if (target < car.grip) car.grip = Math.max(target, car.grip - GRIP_DROP_RATE * dt);
  else car.grip = Math.min(target, car.grip + config.gripRecoverySpeed * dt);

  // Grip kills sideways velocity.
  lat *= Math.exp(-car.grip * dt);

  // Back to world velocity using the (possibly turned) heading.
  const c2 = Math.cos(car.heading), s2 = Math.sin(car.heading);
  car.vx = fwd * c2 - lat * s2;
  car.vy = fwd * s2 + lat * c2;
  car.x += car.vx * dt;
  car.y += car.vy * dt;
}

/* The Circuit: a closed centreline (smoothed through the control points), a constant road
   width, and a grass verge on each side. The Wall stands at the outer edge of the verge. */
const TRACK_CONTROLS = [
  { x: 0, y: -700 }, { x: 900, y: -600 }, { x: 1500, y: -250 }, { x: 1450, y: 300 },
  { x: 900, y: 550 }, { x: 150, y: 300 }, { x: -300, y: 600 }, { x: -700, y: 800 },
  { x: -1300, y: 500 }, { x: -1450, y: -100 }, { x: -1300, y: -500 }, { x: -800, y: -600 }
];
const ROAD_WIDTH = 220;        // width of the tarmac in pixels
const VERGE_WIDTH = 60;        // grass between the road edge and the Wall
const TRACK_SAMPLES = 16;      // centreline points generated per control segment
const START_SETBACK = 80;      // how far behind the start line the car spawns
const CAR_RADIUS = 18;         // the car's collision circle
const IMPACT_MIN_SPEED = 40;   // wall speed (px/s) below which a touch is not worth counting

function createCircuit(controls, roadWidth, vergeWidth, samples) {
  const pts = [], n = controls.length;
  for (let i = 0; i < n; i++) {
    const p0 = controls[(i + n - 1) % n], p1 = controls[i], p2 = controls[(i + 1) % n], p3 = controls[(i + 2) % n];
    for (let k = 0; k < samples; k++) {
      const t = k / samples, t2 = t * t, t3 = t2 * t;
      const spline = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      pts.push({ x: spline(p0.x, p1.x, p2.x, p3.x), y: spline(p0.y, p1.y, p2.y, p3.y) });
    }
  }
  const a = pts[pts.length - 1], b = pts[1], len = Math.hypot(b.x - a.x, b.y - a.y);
  return {
    pts, halfRoad: roadWidth / 2, halfWall: roadWidth / 2 + vergeWidth,
    start: { x: pts[0].x, y: pts[0].y, tx: (b.x - a.x) / len, ty: (b.y - a.y) / len }
  };
}
const CIRCUIT = createCircuit(TRACK_CONTROLS, ROAD_WIDTH, VERGE_WIDTH, TRACK_SAMPLES);

// Nearest point on the centreline to (x, y), and the unit vector from it to the car.
function circuitQuery(circuit, x, y) {
  const pts = circuit.pts, n = pts.length;
  let best = Infinity, cx = 0, cy = 0, bestIndex = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const abx = b.x - a.x, aby = b.y - a.y;
    const t = clamp(((x - a.x) * abx + (y - a.y) * aby) / (abx * abx + aby * aby), 0, 1);
    const px = a.x + abx * t, py = a.y + aby * t;
    const d2 = (x - px) * (x - px) + (y - py) * (y - py);
    if (d2 < best) { best = d2; cx = px; cy = py; bestIndex = i; }
  }
  const dist = Math.sqrt(best);
  let nx = 0, ny = 1;
  if (dist > 1e-6) { nx = (x - cx) / dist; ny = (y - cy) / dist; }
  return { dist, nx, ny, cx, cy, index: bestIndex };
}

function scaleVelocity(car, factor) { car.vx *= factor; car.vy *= factor; }

// Grass slows the car whenever it is mostly off the tarmac.
function applyGrass(car, circuit, dt, config) {
  const nearest = circuitQuery(circuit, car.x, car.y);
  car.surface = nearest.dist + CAR_RADIUS * 0.5 > circuit.halfRoad ? 'grass' : 'road';
  if (car.surface === 'grass') scaleVelocity(car, Math.exp(-config.grassDrag * dt));
}

// The Wall stops the car. A hit with speed into the Wall above crashSpeed is a Crash,
// anything gentler (or glancing) is a Scrape. Both slow the car; touches under
// IMPACT_MIN_SPEED just rub without being recorded.
function collideWithWall(state, dt, config) {
  const car = state.car, circuit = state.circuit;
  const nearest = circuitQuery(circuit, car.x, car.y);
  const limit = circuit.halfWall - CAR_RADIUS;
  if (nearest.dist <= limit) return;
  car.x = nearest.cx + nearest.nx * limit;      // push back inside
  car.y = nearest.cy + nearest.ny * limit;
  const intoWall = car.vx * nearest.nx + car.vy * nearest.ny;
  if (intoWall > 0) {
    car.vx -= (1 + config.wallBounce) * intoWall * nearest.nx;
    car.vy -= (1 + config.wallBounce) * intoWall * nearest.ny;
  }
  scaleVelocity(car, Math.exp(-config.wallScrapeDrag * dt));
  if (intoWall < IMPACT_MIN_SPEED) return;
  const crash = intoWall > config.crashSpeed;
  if (crash) { scaleVelocity(car, config.crashSpeedKept); state.crashCount++; }
  else state.scrapeCount++;
  state.lastImpact = { type: crash ? 'crash' : 'scrape', speed: intoWall, time: state.time };
}
// @sim-end

/* ==================================================================
   GAME LOGIC - the single simulation step the whole game runs through.
   ================================================================== */
// @sim-begin
function createGameState(config) {
  const c = CIRCUIT.start;
  const car = createCarState(config, c.x - c.tx * START_SETBACK, c.y - c.ty * START_SETBACK, Math.atan2(c.ty, c.tx));
  car.surface = 'road';       // 'road' or 'grass'
  return { time: 0, car, circuit: CIRCUIT, lastImpact: null, crashCount: 0, scrapeCount: 0 };
}

// Advance the whole game by dt seconds.
function step(state, inp, dt, config) {
  stepCar(state.car, inp, dt, config);
  applyGrass(state.car, state.circuit, dt, config);
  collideWithWall(state, dt, config);
  state.time += dt;
}
// @sim-end

const PX_TO_KMH = 0.18;  // display only: converts pixels per second to km/h-style units
const MAX_SUBSTEP = 1 / 120;
const game = createGameState(CONFIG);

/* ==================================================================
   RENDERING - canvas drawing, camera, HUD.
   ================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hudSpeed = document.getElementById('hudSpeed');
const camera = { x: 0, y: 0 };
const CAMERA_LOOKAHEAD = 0.3;   // seconds of velocity the camera leads by
const CAMERA_STIFFNESS = 5;     // how tightly the camera follows (higher = snappier)
const TILE = 200;
const WALL_THICKNESS = 10;  // how thick the Wall is drawn (looks only)

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
}
window.addEventListener('resize', resize);
resize();

function updateCamera(dt) {
  const car = game.car;
  const tx = car.x + car.vx * CAMERA_LOOKAHEAD;
  const ty = car.y + car.vy * CAMERA_LOOKAHEAD;
  const k = 1 - Math.exp(-CAMERA_STIFFNESS * dt);
  camera.x += (tx - camera.x) * k;
  camera.y += (ty - camera.y) * k;
}

function drawGround(w, h) {
  ctx.fillStyle = '#2f6b2f';
  ctx.fillRect(0, 0, w, h);
  // Checker tiles so movement is visible on open ground.
  ctx.fillStyle = '#357535';
  const x0 = Math.floor((camera.x - w / 2) / TILE), x1 = Math.ceil((camera.x + w / 2) / TILE);
  const y0 = Math.floor((camera.y - h / 2) / TILE), y1 = Math.ceil((camera.y + h / 2) / TILE);
  for (let tx = x0; tx < x1; tx++) {
    for (let ty = y0; ty < y1; ty++) {
      if ((tx + ty) & 1) ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
    }
  }
}

function tracePath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
}

// Wall, grass verge, road, centre dashes and the start/finish line.
function drawCircuit() {
  const c = game.circuit, pts = c.pts;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  tracePath(pts);
  ctx.strokeStyle = '#e8e8e8';                        // Wall
  ctx.lineWidth = (c.halfWall + WALL_THICKNESS) * 2;
  ctx.stroke();
  ctx.strokeStyle = '#3f8a3f';                        // grass verge
  ctx.lineWidth = c.halfWall * 2;
  ctx.stroke();
  ctx.strokeStyle = '#4a4d52';                        // road
  ctx.lineWidth = c.halfRoad * 2;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';         // centre dashes
  ctx.lineWidth = 4;
  ctx.setLineDash([40, 40]);
  ctx.stroke();
  ctx.setLineDash([]);
  const st = c.start;                                 // start/finish line
  ctx.save();
  ctx.translate(st.x, st.y);
  ctx.rotate(Math.atan2(st.ty, st.tx));
  const cell = 14, rows = Math.ceil(c.halfRoad * 2 / cell);
  for (let r = 0; r < rows; r++) {
    for (let k = 0; k < 2; k++) {
      ctx.fillStyle = (r + k) & 1 ? '#fff' : '#111';
      ctx.fillRect(k * cell - cell, -c.halfRoad + r * cell, cell, cell);
    }
  }
  ctx.restore();
}

function drawCar() {
  const car = game.car;
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.heading);
  ctx.fillStyle = '#d62828';           // body
  ctx.fillRect(-22, -11, 44, 22);
  ctx.fillStyle = '#8ecae6';           // windscreen
  ctx.fillRect(2, -8, 9, 16);
  ctx.fillStyle = '#f7f7f7';           // headlights
  ctx.fillRect(20, -9, 3, 5);
  ctx.fillRect(20, 4, 3, 5);
  ctx.fillStyle = '#111';              // wheels
  ctx.fillRect(10, -14, 9, 4); ctx.fillRect(10, 10, 9, 4);
  ctx.fillRect(-19, -14, 9, 4); ctx.fillRect(-19, 10, 9, 4);
  ctx.restore();
}

function render() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  ctx.translate(w / 2 - camera.x, h / 2 - camera.y);
  drawGround(w, h);
  drawCircuit();
  drawCar();
  ctx.restore();
  const speed = Math.hypot(game.car.vx, game.car.vy);
  hudSpeed.textContent = Math.round(speed * PX_TO_KMH);
}

/* ==================================================================
   GAME LOOP - requestAnimationFrame with delta time.
   ================================================================== */
let lastTime = performance.now();
function frame(now) {
  let dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  const steps = Math.max(1, Math.ceil(dt / MAX_SUBSTEP));
  for (let i = 0; i < steps; i++) step(game, input, dt / steps, CONFIG);
  updateCamera(dt);
  render();
  requestAnimationFrame(frame);
}
camera.x = game.car.x; camera.y = game.car.y;
requestAnimationFrame(frame);

/* ==================================================================
   TUNING PANEL - HTML/CSS overlay with one slider per CONFIG value.
   Moving a slider changes CONFIG at once, so the game reacts instantly.
   ================================================================== */
(function initTuningPanel() {
  const TUNING_KEY = 'drift.tuning.v1';   // slider values
  const PANEL_KEY = 'drift.panel.v1';     // panel open state and position
  const GROUPS = ['Speed', 'Steering', 'Grip', 'Drift Score'];

  function loadJSON(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ } }
  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    for (const c of children) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    return node;
  }
  const decimalsOf = step => (String(step).split('.')[1] || '').length;
  const tidy = (key, v) => Number(v.toFixed(decimalsOf(CONFIG_META[key].step) + 2));

  // Restore saved slider values (ignoring anything unknown or out of range).
  const saved = loadJSON(TUNING_KEY);
  if (saved && typeof saved === 'object') {
    for (const key in CONFIG_META) {
      const v = saved[key], m = CONFIG_META[key];
      if (typeof v === 'number' && isFinite(v)) CONFIG[key] = clamp(v, m.min, m.max);
    }
  }
  const saveTuning = () => saveJSON(TUNING_KEY, CONFIG);

  // ---- Build the panel ----
  const gear = el('button', { id: 'gear', type: 'button', title: 'Tuning panel (H)', textContent: '\u2699' });
  const collapseBtn = el('button', { type: 'button', title: 'Collapse', textContent: '\u2212' });
  const title = el('div', { id: 'panelTitle' }, [el('span', { textContent: 'TUNING' }), collapseBtn]);
  const body = el('div', { id: 'panelBody' });
  const panel = el('div', { id: 'panel' }, [title, body]);
  const sliders = {};   // key -> { input, value }

  for (const group of GROUPS) {
    body.appendChild(el('h4', { textContent: group }));
    for (const key in CONFIG_META) {
      const m = CONFIG_META[key];
      if (m.group !== group) continue;
      const decimals = decimalsOf(m.step);
      const input = el('input', { type: 'range', min: m.min, max: m.max, step: m.step, value: CONFIG[key] });
      const value = el('span', { className: 'val', textContent: CONFIG[key].toFixed(decimals) });
      body.appendChild(el('div', { className: 'row' }, [el('div', { className: 'top' }, [el('span', { textContent: key }), value]), input]));
      sliders[key] = { input, value, decimals };
      input.addEventListener('input', () => {
        CONFIG[key] = tidy(key, Number(input.value));
        value.textContent = CONFIG[key].toFixed(decimals);
        presetSelect.value = '';
        saveTuning();
      });
      // Blur after a click or drag so the arrow keys keep driving the car.
      input.addEventListener('change', () => input.blur());
      input.addEventListener('pointerup', () => input.blur());
    }
  }

  function showValues() {
    for (const key in sliders) {
      const s = sliders[key];
      s.input.value = CONFIG[key];
      s.value.textContent = CONFIG[key].toFixed(s.decimals);
    }
  }

  const presetSelect = el('select', {}, [el('option', { value: '', textContent: 'Presets\u2026' }),
    ...Object.keys(PRESETS).map(name => el('option', { value: name, textContent: name }))]);
  presetSelect.addEventListener('change', () => {
    const preset = PRESETS[presetSelect.value];
    if (preset) { Object.assign(CONFIG, DEFAULT_CONFIG, preset); showValues(); saveTuning(); }
    presetSelect.blur();
  });

  const resetBtn = el('button', { type: 'button', textContent: 'Reset' });
  resetBtn.addEventListener('click', () => {
    Object.assign(CONFIG, DEFAULT_CONFIG);
    presetSelect.value = '';
    showValues(); saveTuning(); resetBtn.blur();
  });

  const copyBtn = el('button', { type: 'button', textContent: 'Copy Config' });
  copyBtn.addEventListener('click', () => {
    const text = '{\n' + Object.keys(CONFIG_META).map(k => '  ' + k + ': ' + CONFIG[k]).join(',\n') + '\n}';
    const done = () => { copyBtn.textContent = 'Copied!'; setTimeout(() => { copyBtn.textContent = 'Copy Config'; }, 1200); };
    const fallback = () => {   // clipboard API needs a secure page; double-clicked files are not
      const ta = el('textarea', { value: text });
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* nothing more to try */ }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
    copyBtn.blur();
  });

  body.appendChild(presetSelect);
  body.appendChild(el('div', { className: 'actions' }, [resetBtn, copyBtn]));
  document.body.appendChild(panel);
  document.body.appendChild(gear);

  // ---- Open, collapse, drag, remember ----
  const ui = Object.assign({ open: true, collapsed: false, left: null, top: null }, loadJSON(PANEL_KEY));
  const saveUI = () => saveJSON(PANEL_KEY, ui);
  function applyUI() {
    panel.classList.toggle('hidden', !ui.open);
    panel.classList.toggle('collapsed', ui.collapsed);
    collapseBtn.textContent = ui.collapsed ? '+' : '\u2212';
    if (typeof ui.left === 'number' && typeof ui.top === 'number') {
      panel.style.right = 'auto';
      panel.style.left = clamp(ui.left, 0, Math.max(0, window.innerWidth - 60)) + 'px';
      panel.style.top = clamp(ui.top, 0, Math.max(0, window.innerHeight - 40)) + 'px';
    }
  }
  function togglePanel() { ui.open = !ui.open; applyUI(); saveUI(); }
  applyUI();

  gear.addEventListener('click', () => { togglePanel(); gear.blur(); });
  collapseBtn.addEventListener('click', () => { ui.collapsed = !ui.collapsed; applyUI(); saveUI(); collapseBtn.blur(); });
  window.addEventListener('keydown', e => {
    if (e.code !== 'KeyH' || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();                       // H must not type or move anything else
    togglePanel();
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  });

  let drag = null;
  title.addEventListener('pointerdown', e => {
    if (e.target === collapseBtn) return;
    const r = panel.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    title.setPointerCapture(e.pointerId);
  });
  title.addEventListener('pointermove', e => {
    if (!drag) return;
    ui.left = e.clientX - drag.dx; ui.top = e.clientY - drag.dy;
    applyUI();
  });
  title.addEventListener('pointerup', () => { if (drag) { drag = null; saveUI(); } });

  // Clicks and wheel on the panel never reach the game.
  for (const node of [panel, gear]) {
    for (const type of ['pointerdown', 'mousedown', 'click', 'dblclick', 'contextmenu', 'wheel']) {
      node.addEventListener(type, e => e.stopPropagation());
    }
  }
})();
</script>
</body>
</html>
